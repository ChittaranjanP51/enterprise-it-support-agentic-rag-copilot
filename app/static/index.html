<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Support Copilot</title>
<style>
  :root { --bg:#f5f7fb; --card:#fff; --ink:#1c2333; --muted:#6b7280; --accent:#4f46e5; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1320; --card:#181d2e; --ink:#e8ebf5; --muted:#9aa3b8; --line:#2a3148; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:760px; padding:12px 14px; border-radius:12px; background:var(--card);
         border:1px solid var(--line); white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; border-color:var(--accent); }
  .meta { margin-top:8px; font-size:12px; color:var(--muted); }
  .badge { display:inline-block; padding:1px 8px; border-radius:99px; background:var(--line); margin-right:6px; }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--line); background:var(--card); }
  input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
          background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:0 20px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
</style>
</head>
<body>
<header>
  <h1>Enterprise IT Support Copilot</h1>
  <p>Answers from company knowledge first, then the web, and always tells you how confident it is.</p>
</header>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="e.g. How do I reset my VPN password?" autocomplete="off" required>
  <button id="b">Ask</button>
</form>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'),
      q = document.getElementById('q'), b = document.getElementById('b');
function add(text, cls, meta) {
  const d = document.createElement('div'); d.className = 'msg ' + (cls || '');
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.append(...meta); d.append(m); }
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}
function badge(t) { const s = document.createElement('span'); s.className = 'badge'; s.textContent = t; return s; }
f.addEventListener('submit', async e => {
  e.preventDefault();
  const question = q.value.trim(); if (!question) return;
  add(question, 'user'); q.value = ''; b.disabled = true;
  const pending = add('Thinking…');
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
                                         body: JSON.stringify({ question }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || r.statusText);
    pending.remove();
    const meta = [badge('source: ' + j.source), badge('confidence: ' + j.confidence)];
    if (j.sources.length) meta.push(document.createTextNode(j.sources.join(', ')));
    add(j.answer, '', meta);
  } catch (err) { pending.textContent = 'Error: ' + err.message; }
  b.disabled = false; q.focus();
});
</script>
</body>
</html>
